<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VRChat Avatar Changer</title>
  <style>
    body {
      width: 320px;
      padding: 15px;
      font-family: 'Segoe UI', sans-serif;
      background: #121212;
      color: #eee;
      margin: 0;
    }
    h1 { font-size: 16px; color: #00ff9d; margin: 0 0 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    h3 { font-size: 13px; margin: 10px 0 5px; color: #aaa; }
    .section { background: #1a1a1a; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #222; }
    label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: bold; color: #888; }
    input {
      width: 100%;
      padding: 8px;
      background: #0f0f0f;
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #00ff9d;
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #00cc7a; }
    button.danger { background: #ff4444; color: white; }
    .status-banner {
      padding: 8px;
      border-radius: 4px;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .on { background: rgba(0, 255, 157, 0.1); color: #00ff9d; border: 1px solid #00ff9d; }
    .off { background: rgba(255, 68, 68, 0.1); color: #ff4444; border: 1px solid #ff4444; }
    .token-box { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
    .token-text { font-family: monospace; font-size: 11px; color: #00ff9d; word-break: break-all; background: #000; padding: 4px; border-radius: 2px; flex-grow: 1; }
    .copy-btn { width: auto; font-size: 10px; padding: 4px 8px; margin: 0; }
    .switch-row { display: flex; justify-content: space-between; align-items: center; }
    .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #00ff9d; }
    input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>
  <h1>VRChat Sync Control</h1>

  <!-- VRChat Site Detection Status -->
  <div id="status-banner" class="status-banner off">Detecting VRChat...</div>

  <!-- Main Settings (Always Visible or conditional) -->
  <div id="main-controls">
    <div class="section">
        <div class="switch-row">
            <label>Master Sync Enabled</label>
            <label class="switch">
                <input type="checkbox" id="enabled">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="section">
        <h3>Backend Server</h3>
        <label>Endpoint URL</label>
        <input type="text" id="wsurl" placeholder="http://localhost:297">
        <button id="save">Save & Update</button>
        <div id="status" style="display:none; margin-top:10px; font-size:11px; text-align:center;"></div>
    </div>

    <div class="section">
        <h3>PIN Management</h3>
        <p id="pinStatus" style="font-size:11px; margin:0 0 10px;">Checking...</p>
        <div id="pinSetup" style="display:none;">
            <input type="password" id="newPin" placeholder="Type a 4-digit PIN" maxlength="4">
            <button id="savePinBtn">Create PIN</button>
        </div>
        <div id="pinReset" style="display:none;">
            <button id="resetPinBtn" class="danger">Reset & Invalidate</button>
        </div>
    </div>

    <div class="section">
        <h3>Session Token</h3>
        <div class="token-box">
            <span id="tokenDisplay" class="token-text">None</span>
            <button id="copyTokenBtn" class="copy-btn">Copy</button>
        </div>
    </div>
  </div>

  <div id="not-on-vrchat" style="display:none; text-align:center; padding-top:10px;">
    <button id="open-vrchat">Open VRChat Dashboard</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
